name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files
        run: |
          echo "Files in repo:"
          ls -la

      - name: Success message
        run: echo "Workflow ran successfully"
